<!DOCTYPE html>
<html>
<head>
    <title>Agent Gateway Configuration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
        input { padding: 5px; width: 300px; }
        button { padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Agent Gateway Configuration</h1>

    <h2>Add New Agent</h2>
    <div id="agentForm">
        <div class="form-group"><label for="name">Name:</label> <input type="text" id="name"></div>
        <div class="form-group"><label for="type">Type:</label> <input type="text" id="type" value="dify"></div>
        <div class="form-group"><label for="endpoint">Endpoint:</label> <input type="text" id="endpoint"></div>
        <div class="form-group"><label for="apiKey">API Key:</label> <input type="password" id="apiKey"></div>
        <div class="form-group"><label for="description">Description:</label> <input type="text" id="description"></div>
        <button onclick="addAgent()">Add Agent</button>
    </div>

    <h2>Existing Agents</h2>
    <table id="agentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Endpoint</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadAgents() {
            const res = await fetch('/api/agents');
            const agents = await res.json();
            const tbody = document.querySelector('#agentTable tbody');
            tbody.innerHTML = '';
            agents.forEach(agent => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${agent.id}</td>
                    <td>${agent.name}</td>
                    <td>${agent.type}</td>
                    <td>${agent.endpoint}</td>
                    <td><button onclick="deleteAgent(${agent.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addAgent() {
            const config = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                endpoint: document.getElementById('endpoint').value,
                apiKey: document.getElementById('apiKey').value,
                description: document.getElementById('description').value
            };
            await fetch('/api/agents', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
            loadAgents();
        }

        async function deleteAgent(id) {
            await fetch(`/api/agents/${id}`, { method: 'DELETE' });
            loadAgents();
        }

        loadAgents();
    </script>
</body>
</html>
