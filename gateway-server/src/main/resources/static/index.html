<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Agent Gateway 控制中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="flex justify-between items-center pb-6 border-b border-gray-200">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Sub-Agent Gateway</h1>
                <p class="text-slate-500 mt-1">嵌入式多智能体协作管理中心</p>
            </div>
            <div class="bg-blue-50 text-blue-700 px-4 py-2 rounded-full text-sm font-medium border border-blue-100">
                系统就绪
            </div>
        </header>

        <!-- 系统全局配置 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                中心编排模型配置 (Orchestrator)
            </h2>
            <div id="currentConfigDisplay" class="mb-4 p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex justify-between items-center hidden">
                <div class="text-sm text-indigo-900">
                    当前中心模型：<span id="currentProviderLabel" class="font-bold">未配置</span> |
                    模型：<span id="currentModelLabel" class="font-bold">-</span> |
                    状态：<span id="currentStatusLabel" class="text-green-600 font-medium">就绪</span>
                </div>
                <button onclick="toggleConfigForm()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">修改配置</button>
            </div>

            <div id="configFormArea" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">供应商</label>
                    <select id="sys_provider" onchange="updateDefaults()" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="openai">OpenAI / 兼容</option>
                        <option value="zhipu">智谱 AI (GLM)</option>
                        <option value="dashscope">阿里千问 (DashScope)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Base URL (可选)</label>
                    <input type="text" id="sys_baseUrl" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">API Key</label>
                    <input type="password" id="sys_apiKey" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="保持为空则不更新">
                </div>
                <div class="flex items-end space-x-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-slate-700 mb-1">模型名称</label>
                        <input type="text" id="sys_modelName" list="modelOptions" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <datalist id="modelOptions"></datalist>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="saveSysConfig()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            应用
                        </button>
                        <button onclick="testConfig()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors">
                            测试
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 配置表单 -->
            <section class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-6">
                <h2 class="text-xl font-semibold text-slate-800 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    新增智能体
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">名称</label>
                        <input type="text" id="name" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none" placeholder="例如：WeatherAgent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">类型</label>
                        <select id="type" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="dify">Dify 架构</option>
                            <option value="openclaw">OpenClaw OpenAPI</option>
                            <option value="custom">自定义插件</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">API 端点 (Endpoint)</label>
                        <input type="text" id="endpoint" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://api.dify.ai/v1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">API Key</label>
                        <input type="password" id="apiKey" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="app-xxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
                        <textarea id="description" rows="2" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="描述此智能体的功能和适用意图"></textarea>
                    </div>
                    <button onclick="addAgent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors flex justify-center items-center">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        保存配置
                    </button>
                </div>
            </section>

            <!-- 列表与测试 -->
            <div class="lg:col-span-2 space-y-8">
                <!-- 智能体列表 -->
                <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        已配置智能体
                    </h2>
                    <div class="overflow-hidden border border-gray-200 rounded-xl">
                        <table class="min-w-full divide-y divide-gray-200" id="agentTable">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">名称</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">类型</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">端点</th>
                                    <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <!-- 动态内容 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 对话测试 -->
                <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        网关实时测试 (Intent Orchestration)
                    </h2>
                    <div class="flex space-x-3">
                        <input type="text" id="queryInput" class="flex-1 px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none" placeholder="输入用户的提问，测试网关的意图识别和协作执行...">
                        <button onclick="sendQuery()" id="sendBtn" class="bg-green-600 hover:bg-green-700 text-white font-medium px-6 py-2 rounded-lg transition-colors flex items-center">
                            <span>执行</span>
                        </button>
                    </div>
                    <div id="resultBox" class="mt-4 p-4 bg-slate-50 rounded-xl border border-dashed border-gray-300 min-h-[100px] text-slate-600 hidden">
                        <div class="font-semibold text-xs text-slate-400 uppercase mb-2">网关响应:</div>
                        <div id="resultContent" class="text-sm whitespace-pre-wrap"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        async function loadAgents() {
            try {
                const res = await fetch('/api/agents');
                const agents = await res.json();
                const tbody = document.querySelector('#agentTable tbody');
                tbody.innerHTML = '';
                agents.forEach(agent => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">${agent.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                            <span class="px-2 py-1 bg-gray-100 rounded-md text-xs">${agent.type}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${agent.endpoint}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="deleteAgent(${agent.id})" class="text-red-600 hover:text-red-800 transition-colors">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("加载列表失败", e);
            }
        }

        async function addAgent() {
            const config = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                endpoint: document.getElementById('endpoint').value,
                apiKey: document.getElementById('apiKey').value,
                description: document.getElementById('description').value
            };
            if (!config.name || !config.apiKey) {
                alert("请填写必要信息");
                return;
            }
            try {
                await fetch('/api/agents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                // 清空表单
                document.getElementById('name').value = '';
                document.getElementById('endpoint').value = '';
                document.getElementById('apiKey').value = '';
                document.getElementById('description').value = '';
                loadAgents();
            } catch (e) {
                alert("保存失败");
            }
        }

        async function deleteAgent(id) {
            if (!confirm("确定删除吗？")) return;
            try {
                await fetch(`/api/agents/${id}`, { method: 'DELETE' });
                loadAgents();
            } catch (e) {
                alert("删除失败");
            }
        }

        async function sendQuery() {
            const query = document.getElementById('queryInput').value;
            if (!query) return;

            const sendBtn = document.getElementById('sendBtn');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span>执行中...</span>';
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = '';

            try {
                const response = await fetch('/api/gateway/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    lines.forEach(line => {
                        if (line.startsWith('event:')) {
                            const eventType = line.substring(6).trim();
                            // Next line should be data:
                        } else if (line.startsWith('data:')) {
                            const data = JSON.parse(line.substring(5).trim());
                            const div = document.createElement('div');
                            div.className = 'mb-2 p-2 bg-white rounded border border-gray-100';

                            if (chunk.includes('event:step_start')) {
                                div.innerHTML = `<span class="text-blue-500 font-bold">[开始执行]</span> 智能体: ${data.agent} (步骤 ${data.step})`;
                            } else if (chunk.includes('event:step_complete')) {
                                div.innerHTML = `<span class="text-green-500 font-bold">[执行完毕]</span> 智能体: ${data.agent}<br/><span class="text-xs text-gray-400">${data.result}</span>`;
                            } else if (chunk.includes('event:final_result')) {
                                div.innerHTML = `<span class="text-slate-800 font-bold">[最终回答]</span><br/>${data.result}`;
                                div.className = 'mb-2 p-3 bg-blue-50 rounded-xl border border-blue-100 text-slate-800 font-medium';
                            } else if (chunk.includes('event:error')) {
                                div.innerHTML = `<span class="text-red-500 font-bold">[错误]</span> ${data.message}`;
                            }

                            if (div.innerHTML) resultContent.appendChild(div);
                        }
                    });
                }
            } catch (e) {
                resultContent.innerText = "请求发生错误: " + e.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<span>执行</span>';
            }
        }

        const DEFAULTS = {
            openai: {
                baseUrl: 'https://api.openai.com/v1',
                modelName: 'gpt-4o',
                models: ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-4', 'gpt-3.5-turbo']
            },
            zhipu: {
                baseUrl: 'https://open.bigmodel.cn/api/paas/v4/',
                modelName: 'glm-4-plus',
                models: ['glm-4-plus', 'glm-4-0520', 'glm-4', 'glm-4-flash', 'glm-4-air', 'glm-4-9b']
            },
            dashscope: {
                baseUrl: 'https://dashscope.aliyuncs.com/api/v1',
                modelName: 'qwen-turbo',
                models: ['qwen-turbo', 'qwen-plus', 'qwen-max', 'qwen-max-longcontext', 'qwen-long']
            }
        };

        function updateDefaults() {
            const provider = document.getElementById('sys_provider').value;
            const config = DEFAULTS[provider];
            if (config) {
                document.getElementById('sys_baseUrl').placeholder = config.baseUrl;

                // Update datalist
                const datalist = document.getElementById('modelOptions');
                datalist.innerHTML = '';
                config.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    datalist.appendChild(opt);
                });

                document.getElementById('sys_modelName').placeholder = config.modelName;
                // If current value is not in any list or empty, set to default
                if (!document.getElementById('sys_modelName').value) {
                    document.getElementById('sys_modelName').value = config.modelName;
                }
            }
        }

        function toggleConfigForm() {
            const form = document.getElementById('configFormArea');
            form.classList.toggle('hidden');
        }

        async function loadSysConfig() {
            try {
                const res = await fetch('/api/config/orchestrator');
                const config = await res.json();
                if (config.provider) {
                    document.getElementById('sys_provider').value = config.provider;
                    document.getElementById('sys_baseUrl').value = config.baseUrl || '';
                    document.getElementById('sys_modelName').value = config.modelName || '';

                    document.getElementById('currentProviderLabel').innerText = document.querySelector(`#sys_provider option[value="${config.provider}"]`).text;
                    document.getElementById('currentModelLabel').innerText = config.modelName || '-';
                    document.getElementById('currentConfigDisplay').classList.remove('hidden');
                    document.getElementById('configFormArea').classList.add('hidden');
                    updateDefaults();
                } else {
                    updateDefaults();
                }
            } catch (e) {
                console.error("加载系统配置失败", e);
            }
        }

        async function testConfig() {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '测试中...';
            try {
                const res = await fetch('/api/gateway/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: 'ping' })
                });
                if (res.ok) alert("测试连接成功！中心模型可正常识别意图。");
                else alert("测试失败，请检查 API Key 和网络配置。");
            } catch (e) {
                alert("请求错误: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        async function saveSysConfig() {
            const config = {
                provider: document.getElementById('sys_provider').value,
                baseUrl: document.getElementById('sys_baseUrl').value,
                apiKey: document.getElementById('sys_apiKey').value,
                modelName: document.getElementById('sys_modelName').value
            };
            try {
                await fetch('/api/config/orchestrator', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                alert("系统配置已应用");
                document.getElementById('sys_apiKey').value = ''; // 清空 key 显示
            } catch (e) {
                alert("应用失败");
            }
        }

        // 初始化
        loadAgents();
        loadSysConfig();
    </script>
</body>
</html>
